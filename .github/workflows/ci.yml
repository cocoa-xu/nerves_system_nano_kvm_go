name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  OTP_VERSION: "29.1.2"
  ELIXIR_VERSION: "1.20.5-otp-29"
  NERVES_BOOTSTRAP_VERSION: "1.17.4"

jobs:
  reuse:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: fsfe/reuse-action@676e2d560c9a403aa252096d99fcab3e1132b0f5 # v6.0.0

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
        with:
          otp-version: ${{ env.OTP_VERSION }}
          elixir-version: ${{ env.ELIXIR_VERSION }}
      - run: mix archive.install --force hex nerves_bootstrap ${{ env.NERVES_BOOTSTRAP_VERSION }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nerves/dl
          key: nerves-dl-${{ hashFiles('mix.lock', 'nerves_defconfig', 'package/**') }}
          restore-keys: nerves-dl-
      - run: mix deps.get
      - name: Build
        run: mix compile
      - name: Package
        run: |
          mix nerves.artifact nerves_system_nano_kvm_go --path artifacts
          ls -l artifacts
          df -h /
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: system
          path: artifacts
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: [reuse, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: system
          path: artifacts
      - name: Check the version
        run: test "$(cat VERSION)" = "${GITHUB_REF_NAME#v}"
      - name: Release notes from the CHANGELOG
        run: |
          awk -v h="## $GITHUB_REF_NAME" 'index($0, h) == 1 && (length($0) == length(h) || substr($0, length(h) + 1, 1) == " ") {f = 1; next} /^## /{f = 0} f' CHANGELOG.md > notes.md
          # GitHub keeps the line breaks of a release's notes: join wrapped lines
          python3 - notes.md <<'EOF'
          import pathlib, sys
          p = pathlib.Path(sys.argv[1])
          out = []
          for line in p.read_text().splitlines():
              if line.strip() and out and out[-1].strip() and not line.startswith("* "):
                  out[-1] = out[-1].rstrip() + " " + line.strip()
              else:
                  out.append(line)
          p.write_text("\n".join(out).strip("\n") + "\n")
          EOF
          grep -q . notes.md
          { echo; echo "## SHA-256"; echo; echo '```'; (cd artifacts && sha256sum -- *); echo '```'; } >> notes.md
          cat notes.md
      - name: Release
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/*
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          fi
