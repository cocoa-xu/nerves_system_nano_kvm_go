# BlueZ on the NanoKVM-Go: its defaults, but for the settings below.

[General]
# Bluetooth LE only: BlueZ offers every GATT service on BR/EDR as well, and
# a phone that pairs there takes the HID over GATT the board emulates as a
# plain GATT service, not as a keyboard.
ControllerMode = le

# A device that paired before and pairs anew, as a phone that forgot the
# NanoKVM does, asks the agent, which says yes while pairing is open.
JustWorksRepairing = confirm

[LE]
# What the board asks of the host it is connected to, in 1.25 ms and 10 ms:
# a connection event each 15 ms, which Apple's accessory guidelines take, for
# input that keeps up with the pointer, and a 2 s supervision timeout, which
# they ask for and the kernel's default (420 ms) is under.
MinConnectionInterval = 12
MaxConnectionInterval = 12
ConnectionLatency = 0
ConnectionSupervisionTimeout = 200
