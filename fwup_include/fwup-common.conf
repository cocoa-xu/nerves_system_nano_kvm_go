#
# Firmware metadata
#

# All of these can be overriden using environment variables of the same name.
#
#  Run 'fwup -m' to query values in a .fw file.
#  Use 'fw_printenv' to query values on the target.
#
# These are used by Nerves libraries to introspect.
define(NERVES_FW_PRODUCT, "Nerves Firmware")
define(NERVES_FW_DESCRIPTION, "")
define(NERVES_FW_VERSION, "${NERVES_SDK_VERSION}")
define(NERVES_FW_PLATFORM, "nano_kvm_go")
define(NERVES_FW_ARCHITECTURE, "arm")
define(NERVES_FW_AUTHOR, "Cocoa")

define(NERVES_FW_DEVPATH, "/dev/mmcblk0")
define(NERVES_FW_APPLICATION_PART0_DEVPATH, "/dev/mmcblk0p4") # Linux part number is 1-based
define(NERVES_FW_APPLICATION_PART0_FSTYPE, "f2fs")
define(NERVES_FW_APPLICATION_PART0_TARGET, "/root")
define(NERVES_PROVISIONING, "${NERVES_SYSTEM}/images/fwup_include/provisioning.conf")

# Default paths if not specified via the commandline
define(ROOTFS, "${NERVES_SYSTEM}/images/rootfs.squashfs")

# This configuration file will create an image that has an MBR and the
# following layout (512-byte blocks):
#
# +----------------------------+ 0
# | MBR                        |
# +----------------------------+ 1024 (0x80000)
# | U-Boot environment         |
# | and its redundant copy     |
# +----------------------------+ 8192 (4 MiB)
# | p1: Boot partition (FAT32) |
# | boot.bin (SPL), uboot.bin  |
# +----------------------------+ 270336 (132 MiB)
# | Kernel A (FIT, raw)        |
# +----------------------------+ 335872 (164 MiB)
# | Kernel B (FIT, raw)        |
# +----------------------------+ 401408 (196 MiB)
# | p2: Rootfs A (squashfs)    |
# +----------------------------+ 925696 (452 MiB)
# | p3: Rootfs B (squashfs)    |
# +----------------------------+ 1449984 (708 MiB)
# | p4: Application (f2fs)     |
# +----------------------------+
#
# The boot ROM loads boot.bin from the first FAT32 partition and SPL loads
# uboot.bin from there. U-Boot reads the kernel FIT of the active slot raw,
# so an update never writes a filesystem that the running slot needs.

# The U-Boot environment is written directly to the SD card, not in any
# partition. U-Boot keeps two copies (CONFIG_SYS_REDUNDAND_ENVIRONMENT).
define(UBOOT_ENV_OFFSET, 1024)
define(UBOOT_ENV_REDUND_OFFSET, 1280)
define(UBOOT_ENV_COUNT, 256)  # 128 KB

# The boot partition holds the boot loaders only. 128 MiB keeps it FAT32,
# which is what the boot ROM is known to read.
define(BOOT_PART_OFFSET, 8192)
define(BOOT_PART_COUNT, 262144)

# Kernel slots: U-Boot reads kernel_blks (16 MiB) of the active one.
define(KERNEL_A_OFFSET, 270336)
define(KERNEL_A_COUNT, 65536)
define(KERNEL_B_OFFSET, 335872)
define(KERNEL_B_COUNT, 65536)

define(ROOTFS_A_PART_OFFSET, 401408)
define(ROOTFS_A_PART_COUNT, 524288)
define-eval(ROOTFS_B_PART_OFFSET, "${ROOTFS_A_PART_OFFSET} + ${ROOTFS_A_PART_COUNT}")
define(ROOTFS_B_PART_COUNT, ${ROOTFS_A_PART_COUNT})

# Application partition. This partition can occupy all of the remaining space.
# Size it to fit the destination.
define-eval(APP_PART_OFFSET, "${ROOTFS_B_PART_OFFSET} + ${ROOTFS_B_PART_COUNT}")
define(APP_PART_COUNT, 1048576)

# Firmware archive metadata
meta-product = ${NERVES_FW_PRODUCT}
meta-description = ${NERVES_FW_DESCRIPTION}
meta-version = ${NERVES_FW_VERSION}
meta-platform = ${NERVES_FW_PLATFORM}
meta-architecture = ${NERVES_FW_ARCHITECTURE}
meta-author = ${NERVES_FW_AUTHOR}
meta-vcs-identifier = ${NERVES_FW_VCS_IDENTIFIER}
meta-misc = ${NERVES_FW_MISC}
